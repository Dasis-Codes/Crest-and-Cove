{% extends 'base.html' %} 
{% load static %} 

{% block content %} 
<section class="section-content padding-y bg">
    <div class="container">
        {% include "includes/alerts.html" %}
        <div class="row">
            {% include "includes/dashboard_sidebar.html" %}
            <!-- MAIN CONTENT -->
            <main class="col-md-9">
                <div class="card">
                    <header class="card-header">
                        <strong class="d-inline-block mr-3">Change Password</strong>
                    </header>
                    <div class="card-body">
                        <form action="{% url 'change_password' %}" method="POST">
                            {% csrf_token %}
                            
                            <div class="form-group">
                                <label>Current Password</label>
                                <input type="password" name="current_password" placeholder="Enter current password" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label>New Password</label>
                                <input type="password" name="new_password" placeholder="Enter new password" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label>Confirm New Password</label>
                                <input type="password" name="confirm_password" placeholder="Confirm new password" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary" style="border-radius: 23px;">Save Changes</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</section>
{% endblock %}
